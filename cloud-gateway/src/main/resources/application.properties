spring.application.name=cloud-gateway

server.port=1919


spring.cloud.gateway.routes[0].id=MENUITEM-SERVICE
spring.cloud.gateway.routes[0].uri=lb://MENUITEM-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/menu/**

spring.cloud.gateway.routes[1].id=ORDER-SERVICE
spring.cloud.gateway.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[2].id=PAYMENT-SERVICE
spring.cloud.gateway.routes[2].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/payments/**

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost